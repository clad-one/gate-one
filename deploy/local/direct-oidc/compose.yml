name: gate-one-local-direct-oidc

# Direct OIDC: Gate One talks to one OIDC issuer, with no IAM in between.
# The demo IdP stands in for Keycloak/Entra/Google.

x-go-tool: &go-tool
  image: alpine:3.20
  restart: unless-stopped
  working_dir: /
  volumes:
    - ${BIN_DIR:-./bin}/gate-one:/bin/gate-one:ro
    - ${BIN_DIR:-./bin}/demo-idp:/bin/demo-idp:ro
    - ${DEMO_CONFIG_DIR:-./config}:/config:ro

services:
  demo-idp:
    <<: *go-tool
    entrypoint: ["/bin/demo-idp"]
    command:
      - "-addr"
      - ":9000"
      - "-issuer"
      - "http://idp.demo.localhost:9000"
      - "-config"
      - "/config/idp.json"
    ports:
      - "9000:9000"
    networks:
      default:
        aliases:
          - idp.demo.localhost
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    image: python:3.12-alpine
    command: ["python", "/app/server.py"]
    restart: unless-stopped
    environment:
      DEMO_TITLE: Direct OIDC demo
    volumes:
      - ${DEMO_BACKEND_DIR:-./backend}:/app:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"
      interval: 2s
      timeout: 2s
      retries: 30

  gate-one:
    <<: *go-tool
    entrypoint: ["/bin/gate-one"]
    command: ["-config", "/config/routes.json", "-addr", ":8080"]
    ports:
      - "8080:8080"
    networks:
      default:
        aliases:
          - app.demo.localhost
          - login.demo.localhost
    environment:
      DEMO_OIDC_SECRET: local-oidc-secret
      GATE_ONE_SESSION_KEY: local-demo-session-key
    depends_on:
      demo-idp:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
