# Gate One behind nginx — complete, minimal configuration.
#
#   container: mount this file at /etc/nginx/nginx.conf and the
#              certificates at /etc/nginx/certs/
#   host:      copy the map/upstream/server blocks into
#              /etc/nginx/conf.d/gate-one.conf and skip the
#              events/http wrappers.
#
# Gate One listens on plain HTTP (default :3000) and must NOT be reachable
# by clients: it trusts X-Forwarded-* from its immediate peer.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # WebSocket upgrades (only needed by applications that use them); for
    # ordinary requests Connection is empty, which keeps the upstream
    # keepalive pool usable.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream gate_one {
        server 127.0.0.1:3000 max_fails=2 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name app.example.com login.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;   # nginx >= 1.25: "listen 443 ssl;" + "http2 on;"
        server_name app.example.com login.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Gate One proxies uploads: the nginx default (1m) would answer 413.
        client_max_body_size 100m;

        location / {
            proxy_pass http://gate_one;
            proxy_http_version 1.1;

            # Gate One routes on (Host, path): pass the public host.
            proxy_set_header Host $host;

            # The three headers Gate One trusts from the immediate hop.
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Behind a CDN, add set_real_ip_from + real_ip_header in the
            # http block so the last X-Forwarded-For entry is the client.

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # SSE and long-lived streams (proxied apps, MCP): nginx buffers
            # by default and small events then never reach the browser.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            gzip off;

            proxy_redirect off;
        }

        # nginx OSS checks the upstream passively (max_fails/fail_timeout).
        # Probe /healthz and /readyz from outside for real readiness.
    }
}
