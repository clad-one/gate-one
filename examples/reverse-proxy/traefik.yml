# Traefik (static configuration) for Gate One.
#
# Run with:  traefik --configfile=/etc/traefik/traefik.yml
# Dynamic routing (routers/services) lives in traefik-dynamic.yml, loaded
# by the file provider — no Docker socket is needed.
#
# If Traefik runs in a container, bind it to the host network (or publish
# 80/443) so that http://127.0.0.1:3000 reaches the gateway.

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

certificatesResolvers:
  le:
    acme:
      email: admin@example.com
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    filename: /etc/traefik/traefik-dynamic.yml

log:
  level: INFO

api:
  dashboard: false
